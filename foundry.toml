[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
skip = ["src/**"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://anvil-node:8545"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }